# Extends the default ruleset. Nothing below turns a rule off wholesale: each
# allowlist is scoped to one rule and one path and one value at the same time,
# so it can only ever skip the exact finding it documents. .gitleaksignore
# carries no fingerprints, on purpose: see the comment in that file.
[extend]
useDefault = true

# The eth_getLogs fixtures are captured JSON-RPC responses whose address,
# topics and data fields are long hex blobs, which the entropy-based
# generic-api-key rule can read as a credential.
#
# targetRules limits this allowlist to that one rule, and condition = "AND"
# means a finding is skipped only when the path AND the value both match, not
# either one (the gitleaks default is OR, which is what made the previous
# path-only allowlist suppress every rule for the whole directory). Verified
# by planting fakes in a scratch copy of the fixture: an AWS key, a PEM
# private key and a non-hex high-entropy api_key are all still reported, and
# the same hex value outside internal/nitro/testdata is still reported.
[[allowlists]]
description = "Raw eth_getLogs fixtures: hex log payloads, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/nitro/testdata/[^/]+\.json$''']
regexes = ['''^0x[0-9a-fA-F]+$''']

# internal/api/ws_test.go builds a WebSocket client handshake by hand. The
# Sec-WebSocket-Key header value is the RFC 6455 sample nonce (base64 of 16
# bytes), which the entropy-based generic-api-key rule reads as a credential.
# A handshake nonce is public by construction: the client sends it in
# plaintext on every connection.
#
# This was an exact .gitleaksignore fingerprint, which binds a finding to a
# line number and so silently stops covering the nonce as soon as the test
# file grows above it (it had already moved twice). Binding it to the file
# and the exact nonce value instead cannot drift. As above, targetRules plus
# condition = "AND" means only that one rule, in that one file, on that one
# value is skipped. Verified by planting fakes in a scratch copy: an AWS access
# key, a PEM private key and a different high-entropy api_key in the same file
# are all still reported, and the same nonce in another file is still reported.
[[allowlists]]
description = "internal/api/ws_test.go: the RFC 6455 sample handshake nonce, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/api/ws_test\.go$''']
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

# internal/nitro/redact_test.go proves that a keyed endpoint URL never reaches
# an error, a log line or /status. Its fixture key is invented for that test
# and exists nowhere else; it has to look like a credential for the test to
# mean anything. Scoped the same way as the two above: one rule, one file, one
# exact value, so any other secret in that file is still reported.
[[allowlists]]
description = "internal/nitro/redact_test.go: the invented key the redaction tests scrub"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/nitro/redact_test\.go$''']
regexes = ['''^s3cret-api-key-0123456789$''']
