# gascurve configuration. Environment variables override these values; see
# .env.example and internal/config for the full list.
server:
  port: 8080
  cors_origins:
    - http://localhost:3000
  dev_mode: false
  # Reverse proxies (CIDRs or addresses) whose X-Forwarded-For is believed
  # for rate limiting. Empty: the peer address is always the client.
  trusted_proxies: []
  # Concurrent WebSocket connections allowed per client address and in total.
  ws_max_per_ip: 8
  ws_max_total: 2000

database:
  url: postgres://postgres:postgres@127.0.0.1:5432/gascurve?sslmode=disable
  max_open: 25
  max_idle: 10
  run_migrations: false

collector:
  metrics_port: 9090         # the collector's own HTTP server, serving /metrics and nothing else; 0 disables it.
                             # The api has an HTTP server already and serves /metrics on server.port.
                             # Environment: METRICS_PORT.
  tick_interval: 3s          # live sample cadence on a polled network: a sample costs six calls, so at the
                             # public budget of four per second a 1 s tick starved the header catch-up and
                             # skipped gaps; dedicated endpoints override this per network (500ms with newHeads)
  slow_interval: 60s         # L1 pricer, balances, owner-action log scan
  header_batch_size: 100     # blocks per JSON-RPC batch when catching up
  block_retention: 48h       # per-block rows kept before pruning to buckets
  sample_retention: 168h     # raw state samples kept
  backfill_depth: 1h         # how far back the owner scan and the resumable backfill reach; a development default,
                             # production sets 720h (30d) in the chart values. "genesis" reaches the first block
                             # however old the chain is: buckets are permanent (prune never deletes them), so the
                             # cost is time, not storage, and a whole 57M-block chain is days of backfill.
                             # Widening it on a running collector extends the floor on the next start and logs
                             # what it did; a shorter duration is reported and otherwise ignored, since it cannot
                             # be told from the window sliding forward as the chain grows. "hold" is how a
                             # narrowing is said deliberately: it keeps everything already reconstructed and
                             # abandons the rest of the descent, once the run in flight has finished. To discard
                             # history below a shorter depth as well, set that depth and raise the network's
                             # history_epoch, which rebuilds from scratch.
  backfill_anchor_interval: 1000  # blocks between state anchors when a network is archive: true
  backfill_window: 10000     # blocks per backfill run on archive networks: history is reconstructed
                             # newest first, a window at a time, each seeded from archive state.
                             # 0 replays each constraint set forward in one run instead.
  max_catch_up_batches: 10   # paced networks skip a catch-up gap larger than this many header batches; unlimited networks never skip
  failover_cooldown: 60s     # time on a fallback endpoint before the primary is probed again (one eth_chainId)
  # ETH/USD spot for the fee cards, fetched server side by the slow loop
  # (the browser never calls a price API). One fetch per interval for the
  # whole process, shared by every network. Supported: coinbase (Coinbase's
  # public spot endpoint, no key), coingecko (the public simple price
  # endpoint), or an https URL answering JSON with a top-level price holding
  # a string or a number. Leave it empty to disable: every snapshot then
  # reports ethUsd: null. Environment: ETH_USD_SOURCE, ETH_USD_MAX_AGE.
  eth_usd_source: coinbase
  eth_usd_max_age: 10m       # past this a quote is reported as null rather than shown as live

# Every network is an Arbitrum Nitro chain. calls_per_second is the budget for
# a public endpoint and counts JSON-RPC calls, including items inside a batch
# request, because that is how the Robinhood public RPC meters. Set it to 0 for
# a dedicated node (unlimited); anything positive below 0.1 (one call every ten
# seconds) is rejected, since a single token would then take longer than any
# request timeout. A quarter of the budget (at least one call per second) is
# reserved for the head sample, so bulk work (catch-up headers, log scans, the
# backfill) never delays that share; what a tick wants beyond it queues first
# come, first served with the bulk work, so a demanding tick slows the backfill
# down rather than stopping it. Below one call per second a whole-token reserve
# is the whole burst, so the two lanes take turns on it instead and a batch
# carries one call at a time. A QuickNode endpoint
# enforces 50 requests per second, counting every item inside a batch, and
# reports the excess as a JSON-RPC error (-32007 "50/second request limit
# reached") rather than an HTTP 429. The pacer's burst is twice the
# sustained rate, so give it calls_per_second: 25: the one-second peaks then
# stay under the window, where 40 tripped it several times a minute and each
# trip cost a 2 s back-off that stalled the backfill and the gap filler.
# Capacity must exceed live ingress for recovery to converge. On a constraints
# chain polled every T seconds at B blocks/s, budget at least
# (5 + max(B*T - 1, 0)) / T calls/s, plus headroom for the slow loop, retries
# and missing-range recovery. With reliable newHeads, budget about 4*B calls/s.
# Legacy pricing adds four calls per sample. /status.capacity reports the latest
# observed requirement and /status.degraded turns true when it is exceeded.
# enabled decides whether the network is part of the site. false stops every
# loop that would index it and the collector records the flag, so the api drops
# the network from /networks and answers 404 below it and the web app stops
# offering it. Stored rows are kept, so switching back restores the chain with
# the history it had. /status keeps reporting it, as disabled. A network with
# no enabled key is off. Environment: NETWORK_<NAME>_ENABLED.
# Optional per network:
#   tick_interval: overrides collector.tick_interval for this network (the
#            polling cadence, and the safety timer while a newHeads
#            subscription is down). A dedicated endpoint can run at 500ms;
#            a public one should stay at 1s, since every tick costs about
#            six calls and a 250ms tick would exceed a 4/s budget.
#            Environment: NETWORK_<NAME>_TICK_INTERVAL.
#   ws_url:  wss endpoint; the collector subscribes to newHeads and samples
#            state at each head instead of polling every tick_interval.
#   archive: true when the node serves historical state; the backfill then
#            anchors the replay to real backlogs every backfill_anchor_interval
#            blocks instead of relying on replay alone.
#   history_epoch: raise it to rebuild this network's reconstructed history
#            once. The collector stores the epoch it last rebuilt at and
#            compares it at start, so a raised number rebuilds and a pod
#            that restarts on the same number does not. Raise it after
#            giving the network an archive endpoint: enabling archive on
#            its own changes nothing already stored, since the backfill has
#            finished and its buckets are never revisited. The rebuild
#            drops the backfill's buckets and checkpoints and replays them
#            again, anchored this time; block rows, owner actions and
#            constraint sets are kept. Raising it alongside a shorter
#            backfill_depth is also how history below the new floor is
#            discarded, since nothing else deletes a bucket. Environment:
#            NETWORK_<NAME>_HISTORY_EPOCH.
#   fallbacks: further endpoints for the same chain, each with the same four
#            fields (rpc_url, ws_url, archive, calls_per_second) and its own
#            token bucket and adaptive batch cap. Ordinary calls go to the
#            primary; after a failed request (transport error, HTTP 5xx, a 429
#            that outlasts its back-off, chain id mismatch) they move to the
#            next fallback for collector.failover_cooldown, then the primary
#            is probed and taken back. newHeads uses the first endpoint with a
#            ws_url and the backfill anchors the first with archive: true,
#            whichever endpoint is active. Every endpoint must report chain_id
#            or it is disabled. Never put URLs that carry keys here: set them
#            in the environment instead (positional, comma-separated lists):
#              NETWORK_<NAME>_FALLBACK_RPC_URLS, NETWORK_<NAME>_FALLBACK_WS_URLS,
#              NETWORK_<NAME>_FALLBACK_ARCHIVE, NETWORK_<NAME>_FALLBACK_CALLS_PER_SECOND
#            Example in YAML for a keyless fallback:
#              fallbacks:
#                - rpc_url: https://spare.example/rpc
#                  ws_url: wss://spare.example/ws
#                  archive: true
#                  calls_per_second: 0
networks:
  - name: robinhood
    display_name: Robinhood Chain
    chain_id: 4663
    rpc_url: https://rpc.mainnet.chain.robinhood.com
    explorer_url: https://robinhoodchain.blockscout.com
    calls_per_second: 4
    enabled: true
  - name: robinhood-testnet
    display_name: Robinhood Chain Testnet
    chain_id: 46630
    rpc_url: https://rpc.testnet.chain.robinhood.com
    explorer_url: https://testnet.robinhoodchain.blockscout.com
    calls_per_second: 4
    enabled: true
  - name: arbitrum-one
    display_name: Arbitrum One
    chain_id: 42161
    rpc_url: https://arb1.arbitrum.io/rpc
    explorer_url: https://arbiscan.io
    calls_per_second: 4
    enabled: true
  - name: arbitrum-sepolia
    display_name: Arbitrum Sepolia
    chain_id: 421614
    rpc_url: https://sepolia-rollup.arbitrum.io/rpc
    explorer_url: https://sepolia.arbiscan.io
    calls_per_second: 4
    enabled: true
