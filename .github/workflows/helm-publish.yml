name: Helm Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Helm chart version to publish, without the prefix. The tag gascurve-chart-v<version> must exist.
        required: true
        type: string
      app_version:
        description: Application version to package as appVersion, without the v prefix. Defaults to the latest published application release.
        required: false
        type: string
        default: ""
      overwrite:
        description: Repair mode. Push even if this chart version already exists in the registry.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  helm:
    # Only chart releases, not app releases
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'gascurve-chart-v')
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.REGISTRY_HOST || 'registry.ahkc.win' }}
      REGISTRY_PROJECT: gascurve
    steps:
      # The chart version comes from the release tag (or the dispatch input)
      # and the chart contents from that tag, never from a branch. The
      # appVersion is deliberately NOT read from the checked-out tree: chart
      # and application releases are separate PRs, so the manifest at the
      # chart tag may predate the application release. It is resolved from
      # the latest published application release (tag vX.Y.Z) instead, or
      # from the app_version input.
      - name: Resolve chart and app versions
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            chart_version="${INPUT_VERSION}"
          else
            chart_version="${RELEASE_TAG#gascurve-chart-v}"
          fi
          if ! printf '%s\n' "${chart_version}" | grep -Eq "${semver}"; then
            echo "::error::Refusing to publish: chart version '${chart_version}' is not a plain semantic version"
            exit 1
          fi
          chart_tag="gascurve-chart-v${chart_version}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${chart_tag}" > /dev/null; then
            echo "::error::Refusing to publish: tag ${chart_tag} does not exist in ${GITHUB_REPOSITORY}. Merge the chart release PR first, then dispatch this workflow with its version."
            exit 1
          fi

          if [ -n "${INPUT_APP_VERSION}" ]; then
            app_version="${INPUT_APP_VERSION}"
            if ! printf '%s\n' "${app_version}" | grep -Eq "${semver}"; then
              echo "::error::app_version '${app_version}' is not a plain semantic version"
              exit 1
            fi
            state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${app_version}" --jq 'if .draft then "draft" elif .prerelease then "prerelease" else "published" end' 2> /dev/null || echo missing)"
            if [ "${state}" != "published" ]; then
              echo "::error::Application release v${app_version} is ${state}. Only published, non-prerelease application releases can be packaged."
              exit 1
            fi
          else
            app_version="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)"
            if [ -z "${app_version}" ]; then
              echo "::error::No published application release (tag vX.Y.Z) exists yet, so there is no appVersion to package. Merge and publish the application release first, then start a new workflow_dispatch of this workflow with version=${chart_version}."
              exit 1
            fi
          fi
          echo "chart=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "chart_tag=${chart_tag}" >> "$GITHUB_OUTPUT"
          echo "app=${app_version}" >> "$GITHUB_OUTPUT"
          echo "Chart ${chart_version} (tag ${chart_tag}) with appVersion ${app_version}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.chart_tag }}

      - name: Verify the tag matches Chart.yaml
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' charts/gascurve/Chart.yaml)"
          if [ "${manifest_version}" != "${CHART_VERSION}" ]; then
            echo "::error::charts/gascurve/Chart.yaml at the checked-out tag says version ${manifest_version}, expected ${CHART_VERSION}"
            exit 1
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Every image for the resolved app version must already be in the
      # registry before a chart that references it can exist.
      - name: Verify application images exist
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
          CHART_VERSION: ${{ steps.version.outputs.chart }}
        run: |
          set -euo pipefail
          missing=0
          for image in gascurve-collector gascurve-api gascurve-web; do
            ref="${REGISTRY}/${REGISTRY_PROJECT}/${image}:${APP_VERSION}"
            if docker manifest inspect "${ref}" > /dev/null 2>&1; then
              echo "ok: ${ref}"
            else
              echo "::error::Image ${ref} does not exist in the registry"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Refusing to publish chart ${CHART_VERSION} with appVersion ${APP_VERSION}: the Docker Publish workflow for release v${APP_VERSION} has not finished (or failed). Once all three images exist, start a new workflow_dispatch of this workflow with version=${CHART_VERSION}. Re-running this job is fine too, as long as the images are there."
            exit 1
          fi

      - name: Helm registry login
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "${REGISTRY_PASSWORD}" | helm registry login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin

      # A chart version is immutable once published. Re-pushing it is only
      # allowed in repair mode.
      - name: Refuse to overwrite a published chart version
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          ref="oci://${REGISTRY}/${REGISTRY_PROJECT}/charts/gascurve"
          if out="$(helm show chart "${ref}" --version "${CHART_VERSION}" 2>&1)"; then
            if [ "${OVERWRITE}" = "true" ]; then
              echo "::warning::Chart ${CHART_VERSION} already exists at ${ref} and overwrite=true was given: it will be replaced"
            else
              echo "::error::Chart ${CHART_VERSION} already exists at ${ref}. Published chart versions are immutable; dispatch again with overwrite=true only to repair a broken chart."
              exit 1
            fi
          elif printf '%s\n' "${out}" | grep -Eiq 'not found|manifest unknown|no such|no chart version found'; then
            echo "ok: chart ${CHART_VERSION} is not published yet"
          else
            echo "::error::Could not check whether chart ${CHART_VERSION} exists at ${ref}: ${out}"
            exit 1
          fi

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: helm package charts/gascurve --version "${CHART_VERSION}" --app-version "${APP_VERSION}"

      - name: Push chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
        run: helm push "gascurve-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${REGISTRY_PROJECT}/charts"
