name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Application version to publish, without the v prefix. A published, non-prerelease release for v<version> must exist.
        required: true
        type: string

permissions:
  contents: read

# Serialize publishes. The registry checks below are check-then-push, so two
# runs that overlap could both pass the check and then race on the same tags.
# The registry is the second line of defence: the Harbor project carries an
# immutable-tag rule matching **/gascurve-*:*.*.* (exact MAJOR.MINOR.PATCH
# tags only), so a published version tag cannot be overwritten even if a
# workflow bug got that far. The moving tags (latest, MAJOR.MINOR) are
# deliberately excluded from that rule.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker:
    # Only application releases (tags v1.2.3). Chart releases are tagged
    # gascurve-chart-v* and are handled by helm-publish.yml.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.REGISTRY_HOST || 'registry.ahkc.win' }}
      REGISTRY_PROJECT: gascurve
    strategy:
      # One image's failure must not cancel the others: a partial publish is
      # resumable (see "Decide what still needs publishing" below), a
      # half-cancelled one is just harder to reason about.
      fail-fast: false
      matrix:
        include:
          - image: gascurve-collector
            dockerfile: Dockerfile.collector
          - image: gascurve-api
            dockerfile: Dockerfile.api
          - image: gascurve-web
            dockerfile: Dockerfile.web
    steps:
      # Resolve and validate the version before checking anything out so a
      # malformed input, or a stray tag on an unreleased commit, can never
      # publish or overwrite anything. A Git tag is not evidence of a release:
      # the version must have a published, non-prerelease GitHub release. The
      # build always comes from that release's tag, never from whatever branch
      # the dispatch was started on.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${RELEASE_TAG#v}"
          fi
          if ! printf '%s\n' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to publish: '${version}' is not a plain semantic version (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          tag="v${version}"

          state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq 'if .draft then "draft" elif .prerelease then "prerelease" else "published" end' 2> /dev/null || echo missing)"
          if [ "${state}" != "published" ]; then
            echo "::error::Refusing to publish: release ${tag} is ${state}. Only a published, non-prerelease GitHub release can be published to the registry. A bare Git tag is not enough. Let release-please create the release, then dispatch this workflow with its version."
            exit 1
          fi

          # The greatest published stable release decides whether the moving
          # tags (latest, MAJOR.MINOR) may move to this version. Repairing or
          # back-filling an older version must never roll latest backward.
          greatest="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)"
          if [ "${greatest}" = "${version}" ]; then
            aliases=true
            echo "${version} is the greatest published stable release: latest and ${version%.*} will point at it"
          else
            aliases=false
            echo "::warning::${version} is not the greatest published stable release (${greatest} is). Publishing only the exact tag ${version}; latest and ${version%.*} are left pointing at ${greatest}."
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "aliases=${aliases}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      # The release tag and the source it points at must agree. release-please
      # writes the version it released into .release-please-manifest.json in
      # the same commit it tags, so a tag moved onto an unrelated commit, or a
      # hand-made tag, is caught here.
      #
      # The commit and its date are recorded as build labels rather than
      # github.sha and "now": on a workflow_dispatch github.sha is the head of
      # whatever branch the dispatch was started from, not the tag being
      # built, and a wrong revision label would make the metadata check below
      # reject a perfectly good rerun.
      - name: Verify the release manifest matches the version
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r '."."' .release-please-manifest.json)"
          if [ "${manifest_version}" != "${VERSION}" ]; then
            echo "::error::.release-please-manifest.json at ${TAG} records root version '${manifest_version}', but ${TAG} claims ${VERSION}. The tag does not point at the commit release-please released."
            exit 1
          fi
          echo "ok: .release-please-manifest.json at ${TAG} records ${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # An exact version tag is immutable: Harbor's immutable-tag rule refuses
      # to replace it, so there is no such thing as repairing one. That leaves
      # exactly two sensible outcomes for a rerun, and this step picks between
      # them:
      #
      #   - the tag is not there: publish it (the normal path, and the path a
      #     rerun takes for whichever images an earlier run did not reach);
      #   - the tag is there and holds what this release should hold: nothing
      #     to do, report success, and carry on to the moving aliases, which
      #     are mutable and may well be what the earlier run failed to write.
      #
      # Anything else, a tag that exists but carries the wrong platforms,
      # version or revision, is a hard failure: it cannot be repaired in
      # place, and the only correct fix is to publish a new patch version.
      # That is why this workflow has no overwrite input.
      - name: Decide what still needs publishing
        id: existing
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          ref="${REGISTRY}/${REGISTRY_PROJECT}/${IMAGE}:${VERSION}"

          if ! raw="$(docker buildx imagetools inspect "${ref}" --raw 2>&1)"; then
            if printf '%s\n' "${raw}" | grep -Eiq 'not found|manifest unknown|no such|MANIFEST_UNKNOWN|NAME_UNKNOWN'; then
              echo "${ref} is not published yet: it will be built, scanned and pushed"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not check whether ${ref} exists: ${raw}"
            exit 1
          fi

          echo "${ref} already exists: verifying that it is this release before treating the push as done"
          platforms="$(printf '%s' "${raw}" \
            | jq -r '[.manifests[]? | select((.platform.os // "unknown") != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | unique | join(",")')"
          if [ "${platforms}" != "linux/amd64,linux/arm64" ]; then
            echo "::error::${ref} already exists but offers platforms '${platforms}' instead of 'linux/amd64,linux/arm64'. An exact version tag is immutable and cannot be repaired: publish a new patch release instead."
            exit 1
          fi

          config="$(docker buildx imagetools inspect "${ref}" --format '{{json .Image}}')"
          got_version="$(printf '%s' "${config}" | jq -r '[.. | objects | select(has("Labels")) | .Labels["org.opencontainers.image.version"] // empty] | unique | join(",")')"
          got_revision="$(printf '%s' "${config}" | jq -r '[.. | objects | select(has("Labels")) | .Labels["org.opencontainers.image.revision"] // empty] | unique | join(",")')"
          if [ "${got_version}" != "${VERSION}" ] || [ "${got_revision}" != "${SHA}" ]; then
            echo "::error::${ref} already exists but was built from something else: it records version '${got_version}' and revision '${got_revision}', expected '${VERSION}' and '${SHA}'. An exact version tag is immutable and cannot be repaired: publish a new patch release instead."
            exit 1
          fi

          echo "ok: ${ref} already holds ${VERSION} (${SHA}) for linux/amd64 and linux/arm64. Nothing to build; the moving aliases are still refreshed below."
          echo "publish=false" >> "$GITHUB_OUTPUT"

      # The binfmt image is pinned by digest (tonistiigi/binfmt:qemu-v10.2.3)
      # so the emulator used for the arm64 build cannot change under a rerun.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: steps.existing.outputs.publish == 'true'
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.existing.outputs.publish == 'true'

      # Each architecture is pushed by digest, with no tag of any kind, and
      # then scanned at that digest. Nothing here can be pulled by name yet,
      # so a failing scan leaves an unreferenced blob in the registry rather
      # than a release tag pointing at a vulnerable image.
      #
      # provenance and sbom are off on purpose: with them on, a push-by-digest
      # build returns the digest of an index (the image plus its attestations)
      # rather than of the image itself, and the scan below would then have to
      # guess which entry inside it to look at. A plain single-platform
      # manifest per architecture means the thing scanned and the thing tagged
      # are the same object by construction.
      - name: Build linux/amd64
        id: amd64
        if: steps.existing.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.REGISTRY_PROJECT }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://gascurve.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan linux/amd64
        if: steps.existing.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REGISTRY_PROJECT }}/${{ matrix.image }}@${{ steps.amd64.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build linux/arm64
        id: arm64
        if: steps.existing.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.REGISTRY_PROJECT }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://gascurve.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The arm64 image is a different set of packages from the amd64 one, so
      # it gets its own scan rather than being taken on trust.
      - name: Trivy scan linux/arm64
        if: steps.existing.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REGISTRY_PROJECT }}/${{ matrix.image }}@${{ steps.arm64.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Only now, with both architectures scanned clean, does the immutable
      # version tag come into existence, as a manifest list over the two
      # digests that were scanned. No rebuild happens here: the tag points at
      # exactly the bytes Trivy looked at.
      - name: Tag the scanned digests as the release version
        if: steps.existing.outputs.publish == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          AMD64_DIGEST: ${{ steps.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.arm64.outputs.digest }}
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${REGISTRY_PROJECT}/${IMAGE}"
          docker buildx imagetools create --tag "${repo}:${VERSION}" \
            "${repo}@${AMD64_DIGEST}" "${repo}@${ARM64_DIGEST}"
          echo "published ${repo}:${VERSION}"
          docker buildx imagetools inspect "${repo}:${VERSION}"

      # The moving tags are updated separately, from the digest the exact tag
      # resolves to, and on every run that gets this far: a rerun whose only
      # job was to finish an interrupted publish still fixes up aliases that
      # the interrupted run never wrote. They are excluded from the registry's
      # immutable-tag rule, so unlike the exact tag they can be replaced.
      - name: Point latest and MAJOR.MINOR at this version
        if: steps.version.outputs.aliases == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${REGISTRY_PROJECT}/${IMAGE}"
          digest="$(docker buildx imagetools inspect "${repo}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "::error::Could not resolve the digest of ${repo}:${VERSION}"
            exit 1
          fi
          docker buildx imagetools create --tag "${repo}:latest" --tag "${repo}:${MINOR}" "${repo}@${digest}"
          echo "latest and ${MINOR} now point at ${digest}"
