name: Chart Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint charts/gascurve --strict

      - name: helm template (defaults, ingress, existing secret)
        run: |
          set -euo pipefail
          helm template gascurve charts/gascurve --set database.url=postgres://x:y@db/gascurve > /tmp/default.yaml
          helm template gascurve charts/gascurve --set database.existingSecret=my-db --set ingress.enabled=true --set ingress.host=gascurve.com > /tmp/ingress.yaml
          grep -q 'kind: Ingress' /tmp/ingress.yaml
          ! grep -q 'kind: Secret' /tmp/ingress.yaml
          grep -q 'kind: Secret' /tmp/default.yaml

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: ct lint
        run: ct lint --config charts/ct.yaml --all
