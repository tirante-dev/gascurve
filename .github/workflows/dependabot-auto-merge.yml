name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # Auto-merge must be enabled with a token other than GITHUB_TOKEN. The
    # eventual merge is attributed to whoever enabled auto-merge, and pushes
    # made with GITHUB_TOKEN never trigger other workflows, so a Dependabot
    # merge would land on main without a CI run and without a Release Please
    # run. That leaves the open release PRs stale (behind main) until the next
    # unrelated merge, and with "require branches to be up to date" on, they
    # then need a manual "Update branch" before they can merge.
    #
    # Same token as release-please.yml: the org GitHub App (RELEASE_APP_ID +
    # RELEASE_APP_PRIVATE_KEY), narrowed to Contents and Pull requests write,
    # with RELEASE_PLEASE_TOKEN as the fallback.
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: env.HAS_RELEASE_APP == 'true'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_PLEASE_TOKEN }}

      # Approval stays on GITHUB_TOKEN: it does not need to trigger anything,
      # and the ruleset requires no approvals, so this is informational only.
      - name: Auto-approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
