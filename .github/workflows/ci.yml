name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gated jobs test `!= 'false'`, never `== 'true'`: if this job fails, its
  # outputs are empty and every gated job runs. A skipped job satisfies a
  # required check, so failing closed here would pass the whole gate unrun.
  changes:
    name: Changed Paths
    runs-on: homelab-2cpu-3ram
    outputs:
      go: ${{ steps.paths.outputs.go }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "go=true" >> "${GITHUB_OUTPUT}"
            echo "web=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "${changed}"
          go=false
          web=false
          if printf '%s\n' "${changed}" | grep -qv '^web/'; then
            go=true
          fi
          if printf '%s\n' "${changed}" | grep -qE '^(web/|\.github/workflows/ci\.yml$)'; then
            web=true
          fi
          echo "go=${go}" >> "${GITHUB_OUTPUT}"
          echo "web=${web}" >> "${GITHUB_OUTPUT}"
          echo "go=${go} web=${web}"

  migration-immutability:
    name: Migration Immutability
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-2cpu-3ram
    steps:
      - name: Install make
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify released migration checksums
        run: make migration-check

  go-format:
    name: Go Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-2cpu-3ram
    steps:
      - name: Install make
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: goimports
        with:
          path: .tools/bin/goimports
          key: go-tool-goimports-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned goimports
        if: steps.goimports.outputs.cache-hit != 'true'
        run: make tool-goimports
      - name: Check formatting
        run: make fmt-check
      - name: Test tooling preflight
        run: make test-tooling

  comments:
    name: Comment Budget
    runs-on: homelab-2cpu-3ram
    steps:
      - name: Install make
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make comment-check

  go-lint:
    name: Go Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-2cpu-3ram
    steps:
      - name: Install make
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: golangci-lint
        with:
          path: .tools/bin/golangci-lint
          key: go-tool-golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned golangci-lint
        if: steps.golangci-lint.outputs.cache-hit != 'true'
        run: make tool-golangci-lint
      - name: golangci-lint
        run: make lint

  go-vet:
    name: Go Vet
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-2cpu-3ram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...

  go-staticcheck:
    name: Staticcheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-2cpu-3ram
    steps:
      - name: Install make
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: staticcheck
        with:
          path: .tools/bin/staticcheck
          key: go-tool-staticcheck-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned staticcheck
        if: steps.staticcheck.outputs.cache-hit != 'true'
        run: make tool-staticcheck
      - run: make staticcheck

  go-test:
    name: Go Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-8cpu-16ram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./internal/...
      - name: Display coverage summary
        run: go tool cover -func=coverage.out
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          THRESHOLD=90
          echo "Total coverage: ${COVERAGE}%"
          if awk -v cov="${COVERAGE}" -v threshold="${THRESHOLD}" 'BEGIN {exit !(cov < threshold)}'; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  go-race:
    name: Race Detection
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-8cpu-16ram
    steps:
      - name: Install make and gcc
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  go-integration:
    name: Integration (Postgres)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-8cpu-16ram-dind
    services:
      postgres:
        image: registry.ahkc.win/docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gascurve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/gascurve_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags integration -count=1 -v ./internal/db/... ./internal/collector/... ./internal/api/...

  # Not gated on changed paths: the vulnerability database changes daily, so
  # an unchanged module graph can still fail here. The same holds for the
  # Trivy scan in Docker Build.
  go-security:
    name: Security Scan
    runs-on: homelab-2cpu-8ram
    steps:
      - name: Install make
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: govulncheck
        with:
          path: .tools/bin/govulncheck
          key: go-tool-govulncheck-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned govulncheck
        if: steps.govulncheck.outputs.cache-hit != 'true'
        run: make tool-govulncheck
      - run: make govulncheck

  go-mod:
    name: Module Verify and Tidy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-2cpu-3ram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify and tidy
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          # -diff prints the changes tidy would make and exits non-zero
          # without writing go.mod or go.sum. Same check as `make mod-verify`.
          if ! go mod tidy -diff; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

  # Not a matrix: a matrix job skipped by its `if` reports one check under the
  # bare job name, so the required "Go Build (linux, amd64)" would never
  # report and every web-only pull request would wait on it forever.
  go-build:
    name: Go Build (linux, amd64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: homelab-8cpu-16ram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -o gascurve-collector-linux-amd64 ./cmd/collector
          go build -o gascurve-api-linux-amd64 ./cmd/api
          go build -o gascurve-migrate-linux-amd64 ./cmd/migrate

  go-build-cross:
    name: Go Build
    if: github.event_name != 'pull_request'
    runs-on: homelab-8cpu-16ram
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -o gascurve-collector-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/collector
          go build -o gascurve-api-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/api
          go build -o gascurve-migrate-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/migrate

  web-lint:
    name: Web Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: homelab-2cpu-3ram
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libatomic for Node
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  web-typecheck:
    name: Web Typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: homelab-2cpu-3ram
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libatomic for Node
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  web-test:
    name: Web Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: homelab-2cpu-3ram
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libatomic for Node
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test-coverage
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(node -e "const s=require('./coverage/coverage-summary.json').total.lines.pct; console.log(s);")
          THRESHOLD=90
          echo "Total coverage: ${COVERAGE}%"
          if awk -v cov="${COVERAGE}" -v threshold="${THRESHOLD}" 'BEGIN {exit !(cov < threshold)}'; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 7

  web-build:
    name: Web Build
    needs: [web-lint, web-typecheck, web-test]
    if: ${{ !cancelled() && needs.web-lint.result == 'success' && needs.web-typecheck.result == 'success' && needs.web-test.result == 'success' }}
    runs-on: homelab-8cpu-16ram
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libatomic for Node
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # The pre-merge half of the image vulnerability gate. It builds the three
  # images from the pull request and fails on a fixable HIGH or CRITICAL, at
  # exactly the severity and exit code Docker Publish uses, so a change that
  # would be unpublishable is rejected before it is merged rather than after
  # a release tag has already been cut.
  #
  # It is not a duplicate of the publish-time scan, and neither can stand in
  # for the other: this one scans a single-architecture image built here, on
  # the merge result, and can only ever be as current as the day it ran;
  # Docker Publish scans the actual linux/amd64 and linux/arm64 digests it is
  # about to tag, against the vulnerability database of the day the release is
  # published. Nothing reaches an immutable version tag without passing there.
  #
  # This job blocks the workflow. Making it block the merge as well is a
  # repository setting: add "Docker Build" to the required status checks for
  # main.
  docker:
    name: Docker Build
    runs-on: homelab-2cpu-3ram-dind
    strategy:
      matrix:
        include:
          - image: gascurve-collector
            dockerfile: Dockerfile.collector
          - image: gascurve-api
            dockerfile: Dockerfile.api
          - image: gascurve-web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Hub's anonymous pull limit is shared by every runner behind the
      # homelab's one public IP, so Hub pulls go through the Harbor cache. Only
      # BuildKit takes a mirror with a path; dockerd's registry-mirrors cannot.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=registry.ahkc.win/docker.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["registry.ahkc.win/docker.io"]
      - name: Build image
        run: docker buildx build --load -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:test .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
