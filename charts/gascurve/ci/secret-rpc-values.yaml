# ct lint / helm lint values: private RPC URLs from a Secret through
# collector.extraEnv, with no plaintext rpc_url for that network. Also covers a
# disabled network with neither rpc_url nor an override, and api and migration
# extra env that must not receive the RPC Secret.
database:
  existingSecret: my-db
collector:
  extraEnv:
    - name: NETWORK_ROBINHOOD_RPC_URL
      valueFrom:
        secretKeyRef:
          name: gascurve-rpc
          key: robinhood
    - name: NETWORK_ROBINHOOD_WS_URL
      valueFrom:
        secretKeyRef:
          name: gascurve-rpc
          key: robinhood-ws
api:
  extraEnv:
    - name: API_ONLY_EXAMPLE
      value: "1"
migrations:
  extraEnv:
    - name: MIGRATE_ONLY_EXAMPLE
      valueFrom:
        configMapKeyRef:
          name: gascurve-migrate
          key: example
config:
  networks:
    - name: robinhood
      display_name: Robinhood Chain
      chain_id: 4663
      explorer_url: https://robinhoodchain.blockscout.com
      calls_per_second: 0
      enabled: true
    - name: arbitrum-one
      display_name: Arbitrum One
      chain_id: 42161
      rpc_url: https://arb1.arbitrum.io/rpc
      explorer_url: https://arbiscan.io
      calls_per_second: 4
      enabled: true
    - name: arbitrum-sepolia
      display_name: Arbitrum Sepolia
      chain_id: 421614
      explorer_url: https://sepolia.arbiscan.io
      calls_per_second: 4
      enabled: false
