# Default values for gascurve.

nameOverride: ""
fullnameOverride: ""

image:
  registry: registry.ahkc.win/gascurve
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion when unset.
  pullSecrets: []

# The collector must run as a single replica: it is the only RPC client and
# the only writer, and two collectors would double the public RPC budget and
# race on the same rows. Recreate strategy guarantees at most one pod.
collector:
  enabled: true
  image:
    repository: gascurve-collector
  # Must match the image's numeric USER (distroless nonroot).
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
  # Extra env for the collector container only (Kubernetes EnvVar objects).
  # This is where private RPC URLs belong: the collector is the only RPC
  # client, so a Secret referenced here never reaches the api or the
  # migration init containers. Every enabled network needs either rpc_url
  # in config.networks or an entry named NETWORK_<NAME>_RPC_URL here (NAME
  # upper-cased, dashes to underscores); the chart refuses to render
  # otherwise.
  extraEnv: []
  # - name: NETWORK_ROBINHOOD_RPC_URL
  #   valueFrom:
  #     secretKeyRef:
  #       name: gascurve-rpc
  #       key: robinhood
  # Portable defaults, sized for one or two networks at the default 3s tick
  # and a backfill that has already caught up. They are deliberately small so
  # the chart installs on a laptop cluster.
  #
  # A production collector is not that workload: it follows every enabled
  # network at once, and on first install each one replays
  # collector.backfill_depth (720h by default) as fast as its budget allows,
  # which is the busiest the process ever gets. Raise the requests, not just
  # the limits: requests are what the scheduler reserves and what decides the
  # CPU share on a contended node, so a collector left at 100m gets the share
  # of a sidecar while it is doing the most work. See the sizing section of
  # charts/gascurve/README.md for what to watch before settling on numbers.
  #
  #   resources:
  #     requests:
  #       cpu: 500m        # 1 for four networks with an unmetered endpoint
  #       memory: 512Mi
  #     limits:
  #       cpu: "2"
  #       memory: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

api:
  enabled: true
  replicaCount: 2
  image:
    repository: gascurve-api
  # Must match the image's numeric USER (distroless nonroot).
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
  # Extra env for the api container only. The api never talks to an RPC, so
  # RPC credentials do not belong here.
  extraEnv: []
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

web:
  enabled: true
  replicaCount: 2
  image:
    repository: gascurve-web
  # Must match the image's numeric USER (nextjs, uid 1001).
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# One host serves both: / goes to web, /api goes to the API. The web image is
# built with NEXT_PUBLIC_API_URL=/api/v1 so it talks to the same origin and
# derives the WebSocket URL from it.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: gascurve.com
  tls: []
  # - secretName: gascurve-tls
  #   hosts: [gascurve.com]

database:
  # Required whenever the collector or the api is enabled: set exactly one of
  # url (rendered into a chart-managed Secret) and existingSecret.
  # values.schema.json rejects an install that sets neither or both.
  url: ""
  existingSecret: ""
  existingSecretKey: DB_URL

# Schema migrations run as an init container on the collector and api pods,
# from the same image as the pod's main container, so the schema always
# matches the binary. golang-migrate holds a Postgres advisory lock while it
# runs, so concurrent pods serialize instead of racing. Disable only if you
# apply migrations some other way (for example `gascurve-migrate up` in CD).
migrations:
  enabled: true
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
  # Extra env for the migrate init containers only. They need DB_URL (always
  # set by the chart) and nothing else in the usual case.
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Rendered into config.yaml and mounted into the collector and api pods.
# Environment overrides still apply (NETWORK_<NAME>_RPC_URL etc). For dedicated
# nodes set calls_per_second: 0 and optionally ws_url and archive: true per
# network; keep private URLs in a Secret via collector.extraEnv rather than
# here (rpc_url may then be omitted for that network).
config:
  server:
    port: 8080
    cors_origins:
      - https://gascurve.com
    dev_mode: false
  database:
    max_open: 25
    max_idle: 10
    run_migrations: false
  collector:
    # The collector's own HTTP server, serving /metrics and nothing else.
    # 0 switches it off; the ServiceMonitor then has no port to scrape.
    metrics_port: 9090
    tick_interval: 3s
    slow_interval: 60s
    header_batch_size: 100
    block_retention: 48h
    sample_retention: 168h
    backfill_depth: 720h
  networks:
    - name: robinhood
      display_name: Robinhood Chain
      chain_id: 4663
      rpc_url: https://rpc.mainnet.chain.robinhood.com
      explorer_url: https://robinhoodchain.blockscout.com
      calls_per_second: 4
      enabled: true
    - name: robinhood-testnet
      display_name: Robinhood Chain Testnet
      chain_id: 46630
      rpc_url: https://rpc.testnet.chain.robinhood.com
      explorer_url: https://testnet.robinhoodchain.blockscout.com
      calls_per_second: 4
      enabled: true
    - name: arbitrum-one
      display_name: Arbitrum One
      chain_id: 42161
      rpc_url: https://arb1.arbitrum.io/rpc
      explorer_url: https://arbiscan.io
      calls_per_second: 4
      enabled: true
    - name: arbitrum-sepolia
      display_name: Arbitrum Sepolia
      chain_id: 421614
      rpc_url: https://sepolia-rollup.arbitrum.io/rpc
      explorer_url: https://sepolia.arbiscan.io
      calls_per_second: 4
      enabled: true

# Prometheus. Both binaries serve /metrics whatever is set here: the api on
# config.server.port, the collector on config.collector.metrics_port from a
# server of its own. What is optional is the operator's objects, which need
# the ServiceMonitor and PrometheusRule CRDs, so both default to off and the
# chart stays installable on a cluster without the Prometheus operator.
metrics:
  serviceMonitor:
    enabled: false
    # Labels the operator's serviceMonitorSelector looks for. Many installs
    # need one (release: kube-prometheus-stack, say); check
    # `kubectl get prometheus -o jsonpath='{..serviceMonitorSelector}'`.
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    # Labels the operator's ruleSelector looks for, as above.
    labels: {}
    # Labels added to every alert, for Alertmanager routing.
    alertLabels: {}
    # A regular expression on the network label naming the networks that
    # follow a dedicated endpoint. They sit at 0 to 2 seconds of lag, so
    # they get the tight lag threshold; every other network is on a public
    # RPC, normally sits at 20 to 60 seconds, and gets the loose one. One
    # threshold for both would either page on a healthy public network or
    # never fire on the dedicated one.
    dedicatedNetworks: robinhood
    # Each alert can be switched off on its own, and its window, threshold
    # and severity changed. `for` is how long the condition must hold;
    # `threshold` is ignored by the alerts that have no number to compare.
    alerts:
      # Lag on a dedicated endpoint: 30 s is fifteen times the 0 to 2 s it
      # normally sits at, so only a real stall reaches it.
      collectorLagDedicated:
        enabled: true
        threshold: 30
        for: 5m
        severity: warning
      # Lag on a public RPC: 180 s is three times the top of the 20 to 60 s
      # band, which a catch-up after a skipped gap stays under.
      collectorLagPublic:
        enabled: true
        threshold: 180
        for: 15m
        severity: warning
      # No state sample for five minutes, on a loop that samples every 0.5
      # to 3 seconds: the follower is not running or cannot write.
      collectorSampleStale:
        enabled: true
        threshold: 300
        for: 2m
        severity: critical
      # Sustained throttling: 0.2 events per second is twelve a minute,
      # each costing a 2 s to 60 s back-off, which starves history work.
      collectorRateLimited:
        enabled: true
        threshold: 0.2
        for: 15m
        severity: warning
      # Every endpoint of a network disabled: nothing can serve it.
      collectorEndpointsExhausted:
        enabled: true
        for: 5m
        severity: critical
      # The collector is not being scraped at all, which no other collector
      # alert can see: its series simply stop existing.
      collectorDown:
        enabled: true
        for: 5m
        severity: critical
      apiDown:
        enabled: true
        for: 5m
        severity: critical
      # More than 5% of answered requests are 5xx.
      apiErrorRate:
        enabled: true
        threshold: 0.05
        for: 10m
        severity: warning
      # /ready answers 503 only when the database ping fails, and the
      # readiness probe runs it every 10 s.
      databaseUnreachable:
        enabled: true
        for: 3m
        severity: critical

# Deprecated: use collector.extraEnv, api.extraEnv and migrations.extraEnv.
# Anything listed here is still applied to all three, and NOTES prints a
# warning while it is set. A component entry with the same name replaces the
# entry here rather than being appended after it, so a container never gets
# two env vars with one name. It exists so existing installs keep working
# across the split and will be removed in a future chart major version. Do not
# put RPC credentials here: they would reach the api and the migration init
# containers too.
extraEnv: []

logLevel: info

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Shared by every container. Per-component runAsUser/runAsGroup live under
# collector/api/web/migrations.securityContext and are merged on top.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

nodeSelector: {}
tolerations: []
affinity: {}
