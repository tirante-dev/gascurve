{{- if .Values.metrics.prometheusRule.enabled }}
{{/*
PrometheusRule needs the Prometheus operator's CRD, which is why
metrics.prometheusRule.enabled defaults to false.

Every rule is built into a list first, so an alert switched off leaves no
empty group behind, and a group with nothing in it is not emitted at all
(the operator rejects one).

Every rule is scoped to the job label an operator derives from a
ServiceMonitor, which is the Service name, so two releases in one cluster
never alert on each other's metrics. Scraping through a hand-written
scrape_config with a different job name therefore needs
metrics.prometheusRule set aside as well; see the chart README.

Prometheus label and value references are written as raw literals here, so
Helm leaves them for Prometheus to expand.
*/}}
{{- $pr := .Values.metrics.prometheusRule }}
{{- $alerts := $pr.alerts }}
{{- $fullname := include "gascurve.fullname" . }}
{{- $apiJob := printf "%s-api" $fullname }}
{{- $collectorJob := printf "%s-collector" $fullname }}
{{- $network := `{{ $labels.network }}` }}
{{- $chain := `{{ $labels.chain_id }}` }}
{{- $seconds := `{{ $value | printf "%.0f" }}` }}
{{- $rate := `{{ $value | printf "%.2f" }}` }}
{{- $percent := `{{ $value | humanizePercentage }}` }}

{{- $collectorRules := list }}
{{- with $alerts.collectorLagDedicated }}
{{- if .enabled }}
{{- $collectorRules = append $collectorRules (dict
  "alert" "GascurveCollectorLagDedicated"
  "expr" (printf "gascurve_collector_head_lag_seconds{job=\"%s\",network=~\"%s\"} > %v" $collectorJob $pr.dedicatedNetworks .threshold)
  "for" .for "severity" .severity
  "summary" (printf "gascurve collector is behind on %s" $network)
  "description" (printf "The collector's head on %s (chain %s) has been %ss old for %s. This network follows a dedicated endpoint and normally sits at 0 to 2 seconds, so anything near %v seconds is a stall, not load." $network $chain $seconds .for .threshold)) }}
{{- end }}
{{- end }}
{{- with $alerts.collectorLagPublic }}
{{- if .enabled }}
{{- $collectorRules = append $collectorRules (dict
  "alert" "GascurveCollectorLagPublic"
  "expr" (printf "gascurve_collector_head_lag_seconds{job=\"%s\",network!~\"%s\"} > %v" $collectorJob $pr.dedicatedNetworks .threshold)
  "for" .for "severity" .severity
  "summary" (printf "gascurve collector is behind on %s" $network)
  "description" (printf "The collector's head on %s (chain %s) has been %ss old for %s. This network is followed over a public RPC and normally sits at 20 to 60 seconds, so %v seconds means the call budget is no longer keeping up." $network $chain $seconds .for .threshold)) }}
{{- end }}
{{- end }}
{{- with $alerts.collectorSampleStale }}
{{- if .enabled }}
{{- $collectorRules = append $collectorRules (dict
  "alert" "GascurveCollectorSampleStale"
  "expr" (printf "time() - gascurve_collector_last_sample_timestamp_seconds{job=\"%s\"} > %v" $collectorJob .threshold)
  "for" .for "severity" .severity
  "summary" (printf "gascurve collector has taken no sample for %s" $network)
  "description" (printf "No successful state sample for %s (chain %s) in %ss. The fast loop samples every 0.5 to 3 seconds, so this is the follower not running, its RPC refusing every call, or the database refusing writes." $network $chain $seconds)) }}
{{- end }}
{{- end }}
{{- with $alerts.collectorRateLimited }}
{{- if .enabled }}
{{- $collectorRules = append $collectorRules (dict
  "alert" "GascurveCollectorRateLimited"
  "expr" (printf "rate(gascurve_collector_rate_limit_events_total{job=\"%s\"}[5m]) > %v" $collectorJob .threshold)
  "for" .for "severity" .severity
  "summary" (printf "gascurve collector is being throttled on %s" $network)
  "description" (printf "The endpoints serving %s (chain %s) have reported throttling %s times a second for %s. Each event costs a 2 to 60 second back-off shared by every loop, so history work stalls first. Lower calls_per_second for that network, or give it an endpoint with a real budget." $network $chain $rate .for)) }}
{{- end }}
{{- end }}
{{- with $alerts.collectorEndpointsExhausted }}
{{- if .enabled }}
{{- $collectorRules = append $collectorRules (dict
  "alert" "GascurveCollectorEndpointsExhausted"
  "expr" (printf "min by (network, chain_id) (gascurve_collector_endpoint_disabled{job=\"%s\"}) == 1" $collectorJob)
  "for" .for "severity" .severity
  "summary" (printf "every gascurve RPC endpoint for %s is disabled" $network)
  "description" (printf "Every endpoint configured for %s (chain %s) has been disabled for %s, so nothing can serve it. /status names the endpoints by index and says why each was disabled." $network $chain .for)) }}
{{- end }}
{{- end }}
{{- with $alerts.collectorDown }}
{{- if .enabled }}
{{- $collectorRules = append $collectorRules (dict
  "alert" "GascurveCollectorDown"
  "expr" (printf "up{job=\"%s\"} == 0" $collectorJob)
  "for" .for "severity" .severity
  "summary" "gascurve collector is not being scraped"
  "description" (printf "The collector (job %s) has not answered a scrape for %s. Every other collector alert goes quiet with it, because its series stop existing rather than going bad." $collectorJob .for)) }}
{{- end }}
{{- end }}

{{- $apiRules := list }}
{{- with $alerts.apiDown }}
{{- if .enabled }}
{{- $apiRules = append $apiRules (dict
  "alert" "GascurveApiDown"
  "expr" (printf "up{job=\"%s\"} == 0" $apiJob)
  "for" .for "severity" .severity
  "summary" "gascurve api is not being scraped"
  "description" (printf "The api (job %s) has not answered a scrape for %s. Every replica is down, or the whole Service has no ready endpoints." $apiJob .for)) }}
{{- end }}
{{- end }}
{{- with $alerts.apiErrorRate }}
{{- if .enabled }}
{{- $apiRules = append $apiRules (dict
  "alert" "GascurveApiErrorRate"
  "expr" (printf "sum(rate(gascurve_api_requests_total{job=\"%s\",status=~\"5..\"}[5m])) / sum(rate(gascurve_api_requests_total{job=\"%s\"}[5m])) > %v" $apiJob $apiJob .threshold)
  "for" .for "severity" .severity
  "summary" "gascurve api is answering errors"
  "description" (printf "%s of the requests the api answered over the last 5 minutes were 5xx, for %s. The api reads PostgreSQL and nothing else, so this is the database or a query, never an RPC." $percent .for)) }}
{{- end }}
{{- end }}
{{- with $alerts.apiListenerDown }}
{{- if .enabled }}
{{- $apiRules = append $apiRules (dict
  "alert" "GascurveApiListenerDown"
  "expr" (printf "min(gascurve_api_listener_ready{job=\"%s\"}) == 0" $apiJob)
  "for" .for "severity" .severity
  "summary" "gascurve api has lost its PostgreSQL notification feed"
  "description" (printf "At least one api replica has had no LISTEN connection for %s. That replica answers /ready with 503 and leaves the Service, and any WebSocket client still on it sees no tick, block or owner action until it recovers. This is NOTIFY, not the query pool: REST reads and the collector's writes are unaffected." .for)) }}
{{- end }}
{{- end }}
{{- with $alerts.databaseUnreachable }}
{{- if .enabled }}
{{- $apiRules = append $apiRules (dict
  "alert" "GascurveDatabaseUnreachable"
  "expr" (printf "sum by (job) (rate(gascurve_api_requests_total{job=\"%s\",route=~\"(/api/v1)?/ready\",status=\"503\"}[5m])) > 0 unless on (job) (min by (job) (gascurve_api_listener_ready{job=\"%s\"}) == 0)" $apiJob $apiJob)
  "for" .for "severity" .severity
  "summary" "gascurve cannot reach PostgreSQL"
  "description" (printf "The api's readiness endpoint has been answering 503 for %s while every replica's notification listener was ready, which leaves the database ping as the cause. The collector cannot write either while this holds." .for)) }}
{{- end }}
{{- end }}

{{- if or $collectorRules $apiRules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "gascurve.labels" . | nindent 4 }}
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if $collectorRules }}
    - name: gascurve.collector
      rules:
        {{- range $collectorRules }}
        - alert: {{ .alert }}
          expr: {{ .expr | quote }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $pr.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: {{ .summary | quote }}
            description: {{ .description | quote }}
        {{- end }}
    {{- end }}
    {{- if $apiRules }}
    - name: gascurve.api
      rules:
        {{- range $apiRules }}
        - alert: {{ .alert }}
          expr: {{ .expr | quote }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $pr.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: {{ .summary | quote }}
            description: {{ .description | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
