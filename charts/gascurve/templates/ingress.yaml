{{- if .Values.ingress.enabled -}}
{{- if and (not .Values.api.enabled) (not .Values.web.enabled) -}}
{{- fail "ingress.enabled is true but both api.enabled and web.enabled are false, so this Ingress would have no HTTP paths and the API server would reject it. Enable the api or the web component, or set ingress.enabled: false. values.schema.json rejects this combination too; you are seeing this message because schema validation was skipped." -}}
{{- end -}}
{{- if and .Values.api.enabled (empty .Values.config.server.trusted_proxies) -}}
{{- fail "ingress.enabled and api.enabled are true but config.server.trusted_proxies is empty. Set it to the addresses or CIDRs of every reverse proxy hop the API should trust. Forwarded client headers remain untrusted when this list is empty. values.schema.json rejects this combination too; you are seeing this message because schema validation was skipped." -}}
{{- end -}}
{{- if and .Values.api.enabled .Values.api.networkPolicy.enabled (empty .Values.api.networkPolicy.allowedPeers) -}}
{{- fail "api.networkPolicy.enabled is true for an ingress deployment but api.networkPolicy.allowedPeers is empty. Configure the ingress controller NetworkPolicy peers, or disable the chart policy only after applying an equivalent policy outside this chart." -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gascurve.fullname" . }}
  labels:
    {{- include "gascurve.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.api.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "gascurve.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          {{- end }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gascurve.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
          {{- end }}
{{- end }}
