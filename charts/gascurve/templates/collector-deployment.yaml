{{- if .Values.collector.enabled }}
{{- include "gascurve.validateNetworkRPC" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gascurve.fullname" . }}-collector
  labels:
    {{- include "gascurve.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  # Exactly one collector. See values.yaml.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gascurve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "gascurve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
      annotations:
        {{- include "gascurve.goPodAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gascurve.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        {{- include "gascurve.migrateInitContainer" (list . .Values.collector.image) | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "gascurve.image" (list . .Values.collector.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "gascurve.containerSecurityContext" (list . .Values.collector.securityContext) | nindent 12 }}
          {{- if gt (int .Values.config.collector.metrics_port) 0 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.config.collector.metrics_port }}
              protocol: TCP
          # Startup only waits for the collector loops to launch. Liveness is
          # deliberately process-only, so an RPC or database outage removes
          # readiness without putting the singleton into a restart loop.
          startupProbe:
            httpGet:
              path: /startup
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 2
          {{- end }}
          env:
            {{- include "gascurve.goEnv" (list . .Values.collector.extraEnv) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gascurve
              readOnly: true
          {{- with .Values.collector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gascurve.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
