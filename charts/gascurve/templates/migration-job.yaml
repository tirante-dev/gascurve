{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gascurve.fullname" . }}-migrate
  labels:
    {{- include "gascurve.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Argo CD ignores helm.sh/hook* once any argocd hook annotation is present,
    # so these define the behaviour there. HookSucceeded,HookFailed keeps a
    # running migration alive across a sync retry instead of deleting it.
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-5"
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded,HookFailed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "gascurve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "gascurve.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "gascurve.image" (list . .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/gascurve-migrate", "up"]
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "gascurve.goEnv" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gascurve
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "gascurve.fullname" . }}-config
{{- end }}
