<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="gascurve">
  <!--
    The gascurve mark: a base fee curve lifting off its floor, with the live
    block as the bright tip. The colours are the dark palette's accents from
    globals.css (the magenta accent into the cyan one, on the chart ground),
    so the icon reads as the site does. The raster icons beside this file
    (favicon.ico, apple-icon.png, public/icon-*.png) are the same geometry on
    the same 64 unit grid; regenerate them together if this changes.
  -->
  <defs>
    <linearGradient id="c" gradientUnits="userSpaceOnUse" x1="13" y1="49" x2="50" y2="16">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#2ee6ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#170a33"/>
  <path d="M13 49C26 49 33 43 39 32C44 22 47 18 50 16" fill="none" stroke="url(#c)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="50" cy="16" r="8.5" fill="#2ee6ff" opacity="0.16"/>
  <circle cx="50" cy="16" r="4.6" fill="#2ee6ff"/>
</svg>
